name: Update text files

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download and build subscriptions
        env:
          BLACK_1: "https://warp-gen.cyb-portal.org/CP-003"
          BLACK_2: "https://warp-gen.cyb-portal.org/CP-002"

          WHITE_1: "https://raw.githubusercontent.com/nwl1909/do/refs/heads/main/configibf"
          WHITE_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"

          EXTRA_WHITE_1: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt"
          EXTRA_WHITE_2: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-1.txt"

        run: |
          set -e


          echo "Downloading BLACK..."

          curl -L --fail --silent --show-error \
            "$BLACK_1" > black1.txt

          curl -L --fail --silent --show-error \
            "$BLACK_2" > black2.txt


          echo "Removing BLACK metadata..."

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            black1.txt > black1-clean.txt || true

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            black2.txt > black2-clean.txt || true


          echo "Building sub-black.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-Black"
            echo "#profile-update-interval: 30"
            echo

            cat black1-clean.txt
            echo

            cat black2-clean.txt

          } > sub-black.txt


          echo "Downloading WHITE..."

          curl -L --fail --silent --show-error \
            "$WHITE_1" > white1.txt

          curl -L --fail --silent --show-error \
            "$WHITE_2" > white2.txt


          echo "Removing WHITE metadata..."

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            white1.txt > white1-clean.txt || true

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            white2.txt > white2-clean.txt || true


          echo "Building sub-white.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-White"
            echo "#profile-update-interval: 30"
            echo

            cat white1-clean.txt
            echo

            cat white2-clean.txt

          } > sub-white.txt


          echo "Downloading EXTRA-WHITE..."

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_1" > extra-white1.txt

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_2" > extra-white2.txt


          echo "Removing EXTRA-WHITE metadata..."

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            extra-white1.txt > extra-white1-clean.txt || true

          grep -viE \
            '^[[:space:]]*#?[[:space:]]*(profile-title|profile-update-interval|support-url|profile-web-page-url|announce|subscription-userinfo|date/time)[[:space:]]*:' \
            extra-white2.txt > extra-white2-clean.txt || true


          echo "Building sub-extra-white.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-Extra-White"
            echo "#profile-update-interval: 30"
            echo

            cat extra-white1-clean.txt
            echo

            cat extra-white2-clean.txt

          } > sub-extra-white.txt


          echo "================================="
          echo "CHECKING GENERATED FILES"
          echo "================================="

          echo "BLACK title:"
          head -n 2 sub-black.txt

          echo

          echo "WHITE title:"
          head -n 2 sub-white.txt

          echo

          echo "EXTRA-WHITE title:"
          head -n 2 sub-extra-white.txt

          echo

          echo "Line counts:"
          wc -l sub-black.txt
          wc -l sub-white.txt
          wc -l sub-extra-white.txt


      - name: Commit updated files
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            sub-black.txt \
            sub-white.txt \
            sub-extra-white.txt


          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi


          git commit \
            -m "Automatic text sources update"

          git push
