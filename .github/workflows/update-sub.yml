name: Update text files

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download and build subscriptions
        env:
          BLACK_1: "https://etoneya.su/other"
          BLACK_2: "https://etoneya.best/other"

          WHITE_1: "https://raw.githubusercontent.com/zieng2/wl/main/vless_universal.txt"
          WHITE_2: "https://etoneya.su/whitelist"

          EXTRA_WHITE_1: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt"
          EXTRA_WHITE_2: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-1.txt"

        run: |
          set -e


          # =========================
          # BLACK
          # =========================

          echo "Downloading BLACK..."

          curl -L --fail --silent --show-error \
            "$BLACK_1" > black1.txt

          curl -L --fail --silent --show-error \
            "$BLACK_2" > black2.txt


          echo "Removing BLACK metadata..."

          sed -i -E \
            '/^[[:space:]]*#?[[:space:]]*profile-title[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-update-interval[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*support-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-web-page-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*announce[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*subscription-userinfo[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*date\/time[[:space:]]*:/Id' \
            black1.txt black2.txt


          echo "Building sub-black.txt..."

          {
            echo "#profile-title: ☕ ChaiVPN-Black"
            echo "#profile-update-interval: 30"
            echo

            cat black1.txt
            echo
            cat black2.txt

          } > sub-black.txt


          # =========================
          # WHITE
          # =========================

          echo "Downloading WHITE..."

          curl -L --fail --silent --show-error \
            "$WHITE_1" > white1.txt

          curl -L --fail --silent --show-error \
            "$WHITE_2" > white2.txt


          echo "Removing WHITE metadata..."

          sed -i -E \
            '/^[[:space:]]*#?[[:space:]]*profile-title[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-update-interval[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*support-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-web-page-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*announce[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*subscription-userinfo[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*date\/time[[:space:]]*:/Id' \
            white1.txt white2.txt


          echo "Building sub-white.txt..."

          {
            echo "#profile-title: ☕ ChaiVPN-White"
            echo "#profile-update-interval: 30"
            echo

            cat white1.txt
            echo
            cat white2.txt

          } > sub-white.txt


          # =========================
          # EXTRA-WHITE
          # =========================

          echo "Downloading EXTRA-WHITE..."

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_1" > extra-white1.txt

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_2" > extra-white2.txt


          echo "Removing EXTRA-WHITE metadata..."

          sed -i -E \
            '/^[[:space:]]*#?[[:space:]]*profile-title[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-update-interval[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*support-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*profile-web-page-url[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*announce[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*subscription-userinfo[[:space:]]*:/Id;
             /^[[:space:]]*#?[[:space:]]*date\/time[[:space:]]*:/Id' \
            extra-white1.txt extra-white2.txt


          echo "Building sub-extra-white.txt..."

          {
            echo "#profile-title: ☕ ChaiVPN-Extra-White"
            echo "#profile-update-interval: 30"
            echo

            cat extra-white1.txt
            echo
            cat extra-white2.txt

          } > sub-extra-white.txt


          # =========================
          # CHECK
          # =========================

          echo
          echo "===== BLACK ====="
          head -n 5 sub-black.txt
          wc -l sub-black.txt

          echo
          echo "===== WHITE ====="
          head -n 5 sub-white.txt
          wc -l sub-white.txt

          echo
          echo "===== EXTRA-WHITE ====="
          head -n 5 sub-extra-white.txt
          wc -l sub-extra-white.txt


      - name: Commit updated files
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            sub-black.txt \
            sub-white.txt \
            sub-extra-white.txt


          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi


          git commit \
            -m "Automatic text sources update"

          git push
