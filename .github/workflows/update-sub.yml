name: Update text files

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update BLACK and WHITE files
        env:
          BLACK_1: "https://warp-gen.cyb-portal.org/CP-003"
          BLACK_2: "https://warp-gen.cyb-portal.org/CP-002"
          WHITE_1: "https://raw.githubusercontent.com/nwl1909/do/refs/heads/main/configibf"
          WHITE_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"

        run: |
          set -e

          echo "Downloading BLACK sources..."

          curl -L --fail --silent --show-error \
            "$BLACK_1" > black1.txt

          curl -L --fail --silent --show-error \
            "$BLACK_2" > black2.txt


          echo "Building sub-black.txt..."

          python3 <<'PY'
          from pathlib import Path

          files = [
              "black1.txt",
              "black2.txt"
          ]

          output = []

          output.append("# profile-title: ☕ ChaiVPN — BLACK")
          output.append("# profile-update-interval: 30")
          output.append("# Назначение: ChaiVPN BLACK")
          output.append("")

          remove_prefixes = (
              "# profile-title:",
              "# profile-update-interval:",
              "# updated:",
              "# Назначение:",
              "# TG chat:",
              "# TG:",
              "# Date/Time:",
              "# Количество:"
          )

          for filename in files:
              text = Path(filename).read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for line in text.splitlines():
                  stripped = line.strip()

                  if any(
                      stripped.startswith(prefix)
                      for prefix in remove_prefixes
                  ):
                      continue

                  output.append(line)

              output.append("")

          Path("sub-black.txt").write_text(
              "\n".join(output).rstrip() + "\n",
              encoding="utf-8"
          )
          PY


          echo "Downloading WHITE-LIST sources..."

          curl -L --fail --silent --show-error \
            "$WHITE_1" > white1.txt

          curl -L --fail --silent --show-error \
            "$WHITE_2" > white2.txt


          echo "Building sub-white.txt..."

          python3 <<'PY'
          from pathlib import Path

          files = [
              "white1.txt",
              "white2.txt"
          ]

          output = []

          output.append("# profile-title: 🍵 ChaiVPN — WHITE-LIST")
          output.append("# profile-update-interval: 30")
          output.append("# Назначение: ChaiVPN WHITE-LIST")
          output.append("")

          remove_prefixes = (
              "# profile-title:",
              "# profile-update-interval:",
              "# updated:",
              "# Назначение:",
              "# TG chat:",
              "# TG:",
              "# Date/Time:",
              "# Количество:"
          )

          for filename in files:
              text = Path(filename).read_text(
                  encoding="utf-8",
                  errors="replace"
              )

              for line in text.splitlines():
                  stripped = line.strip()

                  if any(
                      stripped.startswith(prefix)
                      for prefix in remove_prefixes
                  ):
                      continue

                  output.append(line)

              output.append("")

          Path("sub-white.txt").write_text(
              "\n".join(output).rstrip() + "\n",
              encoding="utf-8"
          )
          PY


          echo "BLACK:"
          wc -l sub-black.txt

          echo "WHITE-LIST:"
          wc -l sub-white.txt


      - name: Commit updated files
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add sub-black.txt sub-white.txt

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit \
            -m "Automatic text sources update"

          git push
