name: Update text files

on:
  workflow_dispatch:

  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  update-sub:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download and build subscriptions
        env:
          BLACK_1: "https://warp-gen.cyb-portal.org/CP-003"
          BLACK_2: "https://warp-gen.cyb-portal.org/CP-002"

          WHITE_1: "https://raw.githubusercontent.com/nwl1909/do/refs/heads/main/configibf"
          WHITE_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"

          EXTRA_WHITE_1: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt"
          EXTRA_WHITE_2: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-1.txt"

        run: |
          set -e

          echo "================================="
          echo "Downloading BLACK sources..."
          echo "================================="

          curl -L --fail --silent --show-error \
            "$BLACK_1" > black1.txt

          curl -L --fail --silent --show-error \
            "$BLACK_2" > black2.txt


          echo "Building sub-black.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-Black"
            echo "#profile-update-interval: 30"
            echo "#announce: ☕ ChaiVPN-Black"
            echo

            cat black1.txt
            echo

            cat black2.txt

          } > sub-black.txt


          echo "================================="
          echo "Downloading WHITE sources..."
          echo "================================="

          curl -L --fail --silent --show-error \
            "$WHITE_1" > white1.txt

          curl -L --fail --silent --show-error \
            "$WHITE_2" > white2.txt


          echo "Building sub-white.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-White"
            echo "#profile-update-interval: 30"
            echo "#announce: ☕ ChaiVPN-White"
            echo

            cat white1.txt
            echo

            cat white2.txt

          } > sub-white.txt


          echo "================================="
          echo "Downloading EXTRA-WHITE sources..."
          echo "================================="

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_1" > extra-white1.txt

          curl -L --fail --silent --show-error \
            "$EXTRA_WHITE_2" > extra-white2.txt


          echo "Building sub-extra-white.txt..."

          {
            echo "profile-title: ☕ ChaiVPN-Extra-White"
            echo "#profile-update-interval: 30"
            echo "#announce: ☕ ChaiVPN-Extra-White"
            echo

            cat extra-white1.txt
            echo

            cat extra-white2.txt

          } > sub-extra-white.txt


          echo "================================="
          echo "RESULT"
          echo "================================="

          echo "BLACK:"
          wc -l sub-black.txt

          echo "WHITE:"
          wc -l sub-white.txt

          echo "EXTRA-WHITE:"
          wc -l sub-extra-white.txt


      - name: Commit updated files
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          git add \
            sub-black.txt \
            sub-white.txt \
            sub-extra-white.txt


          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi


          git commit \
            -m "Automatic text sources update"

          git push
