name: Update status

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
    
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check sources and update status
        env:
          BLACK_1: "https://warp-gen.cyb-portal.org/CP-002"
          BLACK_2: "https://warp-gen.cyb-portal.org/CP-003"
          WHITE_1: "https://raw.githubusercontent.com/nwl1909/do/refs/heads/main/configibf"
          WHITE_2: "https://raw.githubusercontent.com/igareck/vpn-configs-for-russia/refs/heads/main/WHITE-CIDR-RU-all.txt"
          EXTRA_WHITE_1: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-all.txt"
          EXTRA_WHITE_2: "https://raw.githubusercontent.com/whoahaow/rjsxrd/refs/heads/main/githubmirror/bypass/bypass-1.txt"

        run: |

          python3 <<'PY'

          import json
          import hashlib
          import os
          import re
          import urllib.request
          from datetime import datetime, timezone


          SOURCES = {
              "black": {
                  "source1": os.environ["BLACK_1"],
                  "source2": os.environ["BLACK_2"]
              },

              "whitelist": {
                  "source1": os.environ["WHITE_1"],
                  "source2": os.environ["WHITE_2"]
              },

              "extra_white": {
                  "source1": os.environ["EXTRA_WHITE_1"],
                  "source2": os.environ["EXTRA_WHITE_2"]
              }
          }


          # Загружаем предыдущий status.json,
          # чтобы сохранять старые данные при необходимости.

          try:

              with open(
                  "status.json",
                  "r",
                  encoding="utf-8"
              ) as file:

                  old_status = json.load(file)

          except Exception:

              old_status = {}


          def get_old_source(group, name):

              return (
                  old_status
                  .get(group, {})
                  .get(name, {})
              )


          def check_source(group, name, url):

              checked = datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%dT%H:%M:%SZ"
              )


              old = get_old_source(
                  group,
                  name
              )


              try:

                  print(
                      f"Checking {group}/{name}: {url}"
                  )


                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "GitHub-Actions"
                      }
                  )


                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = response.read()


                  text = data.decode(
                      "utf-8",
                      errors="replace"
                  )


                  lines = [
                      line
                      for line in text.splitlines()
                      if line.strip()
                  ]


                  sha256 = hashlib.sha256(
                      data
                  ).hexdigest()


                  # ==========================================
                  # ИЩЕМ # updated: ...
                  # ==========================================

                  source_updated = "—"

                  for line in text.splitlines():

                      match = re.search(
                          r"^\s*#\s*updated:\s*(.+?)\s*$",
                          line,
                          re.IGNORECASE
                      )

                      if match:

                          source_updated = (
                              match.group(1).strip()
                          )

                          break


                  # Если источник не содержит # updated,
                  # сохраняем старое значение.

                  if source_updated == "—":

                      source_updated = old.get(
                          "updated",
                          "—"
                      )


                  print(
                      f"{group}/{name}: "
                      f"{len(lines)} lines"
                  )

                  print(
                      f"{group}/{name}: "
                      f"updated = {source_updated}"
                  )


                  return {

                      "online":
                          True,

                      "configs":
                          len(lines),

                      "updated":
                          source_updated,

                      "checked":
                          checked,

                      "sha256":
                          sha256
                  }


              except Exception as error:

                  print(
                      f"{group}/{name}: ERROR: {error}"
                  )


                  # При ошибке НЕ стираем старую дату.

                  return {

                      "online":
                          False,

                      "configs":
                          old.get(
                              "configs",
                              0
                          ),

                      "updated":
                          old.get(
                              "updated",
                              "—"
                          ),

                      "checked":
                          checked,

                      "sha256":
                          old.get(
                              "sha256"
                          )
                  }


          # ==========================================
          # BLACK
          # ==========================================

          black = {

              "source1":
                  check_source(
                      "black",
                      "source1",
                      SOURCES["black"]["source1"]
                  ),

              "source2":
                  check_source(
                      "black",
                      "source2",
                      SOURCES["black"]["source2"]
                  )
          }


          # ==========================================
          # WHITE-LIST
          # ==========================================

          whitelist = {

              "source1":
                  check_source(
                      "whitelist",
                      "source1",
                      SOURCES["whitelist"]["source1"]
                  ),

              "source2":
                  check_source(
                      "whitelist",
                      "source2",
                      SOURCES["whitelist"]["source2"]
                  )
          }


          # ==========================================
          # EXTRA-WHITE
          # ==========================================

          extra_white = {

              "source1":
                  check_source(
                      "extra_white",
                      "source1",
                      SOURCES["extra_white"]["source1"]
                  ),

              "source2":
                  check_source(
                      "extra_white",
                      "source2",
                      SOURCES["extra_white"]["source2"]
                  )
          }


          # ==========================================
          # ОБЩАЯ СТАТИСТИКА
          # ==========================================

          all_sources = [

              black["source1"],
              black["source2"],

              whitelist["source1"],
              whitelist["source2"],

              extra_white["source1"],
              extra_white["source2"]

          ]


          total_configs = sum(
              source["configs"]
              for source in all_sources
          )


          online = all(
              source["online"]
              for source in all_sources
          )


          # Время проверки самого status.json

          checked = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%dT%H:%M:%SZ"
          )


          # ==========================================
          # STATUS.JSON
          # ==========================================

          status = {

              "online":
                  online,

              "maintenance":
                  False,

              "title":
                  "ChaiVPN by Edicoral",

              "description":
                  "ЧАЙ ВЕРНУЛСЯ! С НОВОЙ СИСТЕМОЙ И КОНФИГАМИ!",

              "configs":
                  total_configs,

              "black":
                  black,

              "whitelist":
                  whitelist,

              "extra_white":
                  extra_white,

              "updated":
                  checked
          }


          with open(
              "status.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  status,
                  file,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("===== STATUS =====")

          print(
              json.dumps(
                  status,
                  ensure_ascii=False,
                  indent=2
              )
          )

          print("==================")


          PY


      - name: Commit status.json
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add status.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit \
            -m "Automatic status update"

          git push
